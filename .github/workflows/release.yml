name: Release

on:
  push:
    tags:
      - "v*"
  release:
    types:
      - published
  workflow_dispatch:

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Set up Python 3.12
      uses: actions/setup-python@v6
      with:
        python-version: "3.12"

    - name: Install build tooling
      run: |
        python -m pip install --upgrade pip build twine

    - name: Clean previous build outputs
      run: |
        rm -rf build dist *.egg-info

    - name: Build distributions
      run: |
        python -m build

    - name: Check distributions
      run: |
        python -m twine check dist/*

    - name: Verify reference resources
      run: |
        python - <<'PY'
        import glob
        import zipfile

        wheel = glob.glob("dist/*.whl")[0]
        context_prefix = (
            "SigProfilerMatrixGenerator/references/chromosomes/"
            "context_distributions/"
        )
        with zipfile.ZipFile(wheel) as archive:
            names = set(archive.namelist())
            manifest_name = context_prefix + "context_table_manifest.txt"
            assert manifest_name in names
            expected = {
                line.strip()
                for line in archive.read(manifest_name).decode("utf-8").splitlines()
                if line.strip() and not line.startswith("#")
            }
            observed = {
                name.removeprefix(context_prefix)
                for name in names
                if name.startswith(context_prefix) and name.endswith(".csv")
            }
        assert expected == observed
        assert not any("_TSBv2" in name or "_pending" in name for name in names)
        PY

    - name: Verify package version
      run: |
        python -m pip install dist/*.whl
        python -c "import SigProfilerMatrixGenerator; print(SigProfilerMatrixGenerator.__version__)"

    - name: Upload distributions
      uses: actions/upload-artifact@v7
      with:
        name: python-package-distributions
        path: dist/
        if-no-files-found: error

  publish-testpypi:
    name: Publish to TestPyPI
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/SigProfilerMatrixGenerator
    permissions:
      id-token: write
    steps:
    - name: Download distributions
      uses: actions/download-artifact@v5
      with:
        name: python-package-distributions
        path: dist/

    - name: Publish package distributions to TestPyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    name: Publish to PyPI
    needs: build
    if: github.event_name == 'release' && github.event.action == 'published'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/SigProfilerMatrixGenerator
    permissions:
      id-token: write
    steps:
    - name: Download distributions
      uses: actions/download-artifact@v5
      with:
        name: python-package-distributions
        path: dist/

    - name: Publish package distributions to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
