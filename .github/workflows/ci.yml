name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Test (${{ matrix.python-version }}, pandas ${{ matrix.pandas-label }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: '3.10'
            pandas-label: '2.2.3'
            pandas-spec: 'pandas==2.2.3'
          - python-version: '3.12'
            pandas-label: '2.2.3'
            pandas-spec: 'pandas==2.2.3'
          - python-version: '3.12'
            pandas-label: '3.x'
            pandas-spec: 'pandas>=3,<4'
          - python-version: '3.14'
            pandas-label: '3.x'
            pandas-spec: 'pandas>=3,<4'
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Upgrade pip, setuptools, and packaging
      run: |
        python -m pip install --upgrade pip setuptools packaging

    - name: Pin pandas ${{ matrix.pandas-label }}
      run: |
        python -m pip install --upgrade "${{ matrix.pandas-spec }}"
    
    - name: Cache src directory
      uses: actions/cache@v4
      with:
        path: ./src/
        key: ${{ runner.os }}-src-grch37
        restore-keys: |
          ${{ runner.os }}-src-
    
    - name: Download GRCh37.tar.gz if not present
      run: |
        if [ ! -f ./src/GRCh37.tar.gz ]; then
          wget --connect-timeout=10 --tries=20 ftp://alexandrovlab-ftp.ucsd.edu/pub/tools/SigProfilerMatrixGenerator/GRCh37.tar.gz -P ./src/
        fi
    
    - name: Install package with tests
      run: |
        pip install .[tests]
    
    - name: Install genome
      run: |
        python install_genome.py -l ${{ github.workspace }}/src/ GRCh37
    
    - name: Run unit tests
      run: |
        pytest tests
    
    - name: Run integration test
      run: |
        python3 test.py -t GRCh37
    
    - name: Build and push Docker image
      if: github.ref == 'refs/heads/master' && github.event_name == 'push' && matrix.python-version == '3.12' && matrix.pandas-label == '3.x'
      run: |
        echo "Starting Docker deployment to GHCR for sigprofilersuite..."
        
        python -m pip install --upgrade setuptools_scm
        VERSION_TAG=$(python -m setuptools_scm)
        VERSION_TAG=${VERSION_TAG//+/-}
        
        # Get the repository name and convert it to lowercase
        REPO_NAME=$(basename ${{ github.repository }} | tr '[:upper:]' '[:lower:]')
        IMAGE_NAME="ghcr.io/sigprofilersuite/$REPO_NAME"
        
        echo "Building version: $VERSION_TAG for image: $IMAGE_NAME"
        
        echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
          --username "${{ github.actor }}" \
          --password-stdin
        
        docker build \
          --build-arg COMMIT_SHA=${{ github.sha }} \
          -t $IMAGE_NAME:$VERSION_TAG \
          -t $IMAGE_NAME:latest .
        
        docker push $IMAGE_NAME:$VERSION_TAG
        docker push $IMAGE_NAME:latest
        
        echo "Docker deployment to GHCR successful"
